services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
      POSTGRES_DB: ${DB_NAME:-agentic_rag}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: